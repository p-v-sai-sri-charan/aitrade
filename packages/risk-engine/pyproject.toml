[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaanitrade-risk-engine"
version = "0.1.0"
description = "Deterministic, dependency-free risk checks for VaaniTrade orders."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
include = ["risk_engine*"]
