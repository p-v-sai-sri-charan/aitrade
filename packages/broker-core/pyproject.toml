[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaanitrade-broker-core"
version = "0.1.0"
description = "BrokerAdapter interface and a realistic simulated paper broker for VaaniTrade."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
include = ["broker_core*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
