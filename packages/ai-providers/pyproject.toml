[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaanitrade-ai-providers"
version = "0.1.0"
description = "Provider-neutral AI interface for VaaniTrade (intent extraction + risk explanation)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
openai = ["openai>=1.40"]
gemini = ["google-generativeai>=0.7"]

[tool.setuptools.packages.find]
include = ["ai_providers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
